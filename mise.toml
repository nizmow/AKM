[tools]
python = "3.13.7"

# The Linux x86-64 AppImage includes the GUI, headless runner and EmuTOS ROMs.
# Extract once at install time: headless runs must not depend on FUSE.

[tools."github:habib256/neost"]
version = "0.6.5"
os = ["linux/x64"]
asset_pattern = "NeoST-0.6.5-x86_64.AppImage"
checksum = "sha256:a37c54c65ef882be8ed8cb1f75f87b548692d53bad13849b6244f0e8a24d3af8"
format = "raw"
bin_path = "squashfs-root/usr/bin"
postinstall = 'cd "$MISE_TOOL_INSTALL_PATH" && "./squashfs-root/usr/bin/NeoST-$MISE_TOOL_VERSION-x86_64.AppImage" --appimage-extract > /dev/null'

# Toolchain and everyday builds

[tasks."toolchain:build"]
description = "Build the Atari cross-toolchain Podman image"
dir = "{{ config_root }}"
run = "scripts/atari-container build"

[tasks."toolchain:shell"]
description = "Open a shell in the Atari toolchain container"
dir = "{{ config_root }}"
raw = true
run = "scripts/atari-container shell"

[tasks.atari]
description = "Run a command in the Atari toolchain container"
dir = "{{ config_root }}"
raw = true
run = "scripts/atari-container run"

[tasks.make]
description = "Run Makefile.atari with arbitrary targets and options"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.atari"

[tasks.kernel]
description = "Build the German Atari/68000 MAGIC.RAM kernel"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.atari magic"

[tasks.apps]
description = "Run Makefile.apps with application targets and options"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.apps"

# Core package and install smoke

[tasks."release:core"]
description = "Assemble the deterministic German Atari/ST core installation ZIP"
dir = "{{ config_root }}"
run = "python3 scripts/make-release.py --output build/atari/release/core-de.zip --manifest build/atari/release/core-de.manifest"

[tasks."test:release-neost"]
description = "Build, install and boot the German core ZIP on a clean MagiC image"
dir = "{{ config_root }}"
run = "python3 scripts/neost-release-smoke.py"

# ABI, encoding, and host-helper checks

[tasks."test:neost-server"]
description = "Run NeoST server client protocol regression tests"
dir = "{{ config_root }}"
run = "python3 scripts/test_neost_server.py"

[tasks."test:neost-helpers"]
description = "Run NeoST host-side image, screen and session helper tests"
dir = "{{ config_root }}/scripts"
run = "python3 -m unittest test_neost_common test_neost_host test_neost_image test_neost_screen"

[tasks."test:encoding"]
description = "Verify strict Atari ST text conversion and C literal escapes"
dir = "{{ config_root }}"
run = "python3 -m unittest discover -s NON-TOS/atari-utf8-conversion -p 'test_*.py'"

[tasks."test:abi"]
description = "Compile the application ABI layout checks"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.apps abi-check"

[tasks."lint:cpx-abi"]
description = "Reject CPX native callback access outside approved ABI bridges"
dir = "{{ config_root }}"
run = "python3 scripts/cpx_abi_lint.py"

[tasks."test:cpx-abi"]
description = "Lint CPX callbacks and execute bridge ABI regressions under QEMU"
dir = "{{ config_root }}"
run = "python3 scripts/cpx_abi_lint.py && python3 -m unittest discover -s scripts -p 'test_cpx_*.py'"

# Component regressions (opt-in emulator scenarios)

[tasks."test:mod-app-neost"]
description = "Compare archived and GCC MOD_APP under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mod-app-smoke.py"

