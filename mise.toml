[tasks."ports:brief"]
description = "Build a porting brief for one component"
dir = "{{ config_root }}"
run = "python3 scripts/port_brief.py"

[tasks."ports:compile"]
description = "Run syntax-only probes over remaining sources"
dir = "{{ config_root }}"
run = "python3 scripts/compile_probe.py"

# Special-purpose tasks: legacy registry and standalone test fixture

