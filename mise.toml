[tools]
python = "3.13.7"

# The Linux x86-64 AppImage includes the GUI, headless runner and EmuTOS ROMs.
# Extract once at install time: headless runs must not depend on FUSE.

[tools."github:habib256/neost"]
version = "0.6.5"
os = ["linux/x64"]
asset_pattern = "NeoST-0.6.5-x86_64.AppImage"
checksum = "sha256:a37c54c65ef882be8ed8cb1f75f87b548692d53bad13849b6244f0e8a24d3af8"
format = "raw"
bin_path = "squashfs-root/usr/bin"
postinstall = 'cd "$MISE_TOOL_INSTALL_PATH" && "./squashfs-root/usr/bin/NeoST-$MISE_TOOL_VERSION-x86_64.AppImage" --appimage-extract > /dev/null'

[tasks."toolchain:build"]
description = "Build the Atari cross-toolchain Podman image"
dir = "{{ config_root }}"
run = "scripts/atari-container build"

[tasks."toolchain:publish"]
description = "Build and push the Atari cross-toolchain image to GitLab"
dir = "{{ config_root }}"
run = "scripts/atari-container publish"

[tasks."toolchain:shell"]
description = "Open a shell in the Atari toolchain container"
dir = "{{ config_root }}"
raw = true
run = "scripts/atari-container shell"

[tasks.atari]
description = "Run a command in the Atari toolchain container"
dir = "{{ config_root }}"
raw = true
run = "scripts/atari-container run"

[tasks.make]
description = "Run Makefile.atari with arbitrary targets and options"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.atari"

[tasks.kernel]
description = "Build the German Atari/68000 MAGIC.RAM kernel"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.atari magic"

[tasks.apps]
description = "Run Makefile.apps with application targets and options"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.apps"

[tasks."test:mod-app-neost"]
description = "Compare archived and GCC MOD_APP under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mod-app-smoke.py"

[tasks."test:mgcopy-neost"]
description = "Compare archived and rebuilt MGCOPY file operations under NeoST/MagiC"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mgcopy-smoke.py"

[tasks."test:console-tools-neost"]
description = "Compare archived and rebuilt MAC2ST, DUMP, FC and SPLIT under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-console-tools-smoke.py"

[tasks."test:mgclock-neost"]
description = "Verify MGCLOCK desktop timer and MagiC coexistence under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mgclock-smoke.py"

[tasks."test:mgnotice-neost"]
description = "Compare archived and rebuilt MGNOTICE note lifecycle under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mgnotice-smoke.py"

[tasks."test:mgsearch-neost"]
description = "Compare archived and rebuilt MGSEARCH dialogs and results under NeoST"
dir = "{{ config_root }}"
run = "python3 scripts/neost-mgsearch-smoke.py"

[tasks."test:neost-server"]
description = "Run NeoST server client protocol regression tests"
dir = "{{ config_root }}"
run = "python3 scripts/test_neost_server.py"

[tasks."test:neost-helpers"]
description = "Run NeoST host-side image, screen and session helper tests"
dir = "{{ config_root }}/scripts"
run = "python3 -m unittest test_neost_common test_neost_host test_neost_image test_neost_screen"

[tasks."test:encoding"]
description = "Verify strict Atari ST text conversion and C literal escapes"
dir = "{{ config_root }}"
run = "python3 -m unittest discover -s NON-TOS/atari-utf8-conversion -p 'test_*.py'"

[tasks."test:abi"]
description = "Compile the application ABI layout checks"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.apps abi-check"

[tasks."verify:apps"]
description = "Check expected application outputs; pass -- --build for a fresh build"
dir = "{{ config_root }}"
run = "python3 scripts/verify_builds.py"

[tasks."ports:scan"]
description = "Scan the port catalogue for remaining sources and legacy paths"
dir = "{{ config_root }}"
run = "python3 scripts/port_scan.py"

[tasks."ports:deps"]
description = "Resolve legacy PRJ module and header references"
dir = "{{ config_root }}"
run = "python3 scripts/port_deps.py"

[tasks."ports:brief"]
description = "Build a porting brief for one component"
dir = "{{ config_root }}"
run = "python3 scripts/port_brief.py"

[tasks."ports:compile"]
description = "Run syntax-only probes over remaining sources"
dir = "{{ config_root }}"
run = "python3 scripts/compile_probe.py"

[tasks."test:console-driver"]
description = "Build the generic Pexec driver for console comparisons"
dir = "{{ config_root }}"
run = "scripts/atari-container run make -f Makefile.apps console-test-driver"
